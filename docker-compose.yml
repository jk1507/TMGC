# ============================================
# RETRO_INTEL — Docker Compose
# ============================================
# Quick start: docker-compose up --build
# Production: docker-compose -f docker-compose.yml up -d

version: "3.8"

services:
  # ============================================
  # Backend (FastAPI + Python)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retro-intel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LOKY_MAX_CPU_COUNT=2
    volumes:
      # Persist ML models and training data
      - backend-models:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - retro-intel-net

  # ============================================
  # Frontend (React + Nginx)
  # ============================================
  frontend:
    build:
      context: ./front_end
      dockerfile: Dockerfile
    container_name: retro-intel-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - retro-intel-net

# ============================================
# Volumes (persist data)
# ============================================
volumes:
  backend-models:
    driver: local

# ============================================
# Network
# ============================================
networks:
  retro-intel-net:
    driver: bridge
